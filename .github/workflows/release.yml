# Release publishing: pushing a `v*` tag builds the plugin, runs the test
# suite, packs the npm tarball, and publishes a GitHub release with
# auto-generated notes and the tarball attached. The tag is the trigger and
# the release title; nothing else needs manual input.
#
# The tag name must match the package version (tests/manifest-consistency.spec
# locks package.json, dsh.plugin.json and PLUGIN_VERSION to each other), so
# bump the version first, then: git tag v<version> && git push --tags.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node's cache hook runs.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A tag that drifts from the package version would publish a release
      # whose tarball and title disagree — refuse it up front.
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; if (tag !== 'v'+p.version) { console.error('tag '+tag+' does not match package version v'+p.version); process.exit(1) } console.log('tag matches v'+p.version)"

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Pack
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist
          echo "TARBALL=$(ls dist/*.tgz)" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" "$TARBALL"
          # Append the version-compatibility notice to the auto-generated body
          # so every release page tells older-DSH users exactly what to do.
          gh release view "$GITHUB_REF_NAME" --json body -q .body > release-notes.md
          {
            echo ""
            echo "## 兼容性提示 / Compatibility notice"
            echo ""
            echo "- 支持 DeepSeek Harness **≥ 0.1.2-rc.1**。"
            echo "- 旧版 DeepSeek Harness（0.1.1-rc.x / 0.1.2-alpha.x 及更早）用户：请安装本插件的**旧版本**（如 v0.1.4）。"
            echo "- Requires DeepSeek Harness **≥ 0.1.2-rc.1**. Users on older kernels (0.1.1-rc.x / 0.1.2-alpha.x and earlier) should install an **earlier release** of this plugin (e.g. v0.1.4)."
          } >> release-notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
