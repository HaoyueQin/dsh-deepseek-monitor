<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="DSH DeepSeek Monitor banner">
  <title>DSH DeepSeek Monitor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191b22"/><stop offset="1" stop-color="#131419"/>
    </linearGradient>
    <linearGradient id="pf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4DA6FF"/><stop offset="1" stop-color="#8FC6FF"/>
    </linearGradient>
    <linearGradient id="pv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8F7DF0"/><stop offset="1" stop-color="#C0B3FF"/>
    </linearGradient>
    <linearGradient id="pp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4D6BFE"/><stop offset="1" stop-color="#8093FF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <circle cx="1060" cy="252" r="260" fill="#4D6BFE" opacity="0.08"/>
    <circle cx="1180" cy="24" r="140" fill="#8F7DF0" opacity="0.09"/>
    <circle cx="688" cy="14" r="90" fill="#4DA6FF" opacity="0.08"/>

    <!-- left: wordmark + tagline + feature pills -->
    <rect x="64" y="44" width="112" height="26" rx="13" fill="#4D6BFE" fill-opacity="0.16"/>
    <text x="78" y="61" font-size="11" font-weight="600" fill="#7c90ff">dsh web plugin</text>
    <text x="64" y="118" font-size="44" font-weight="700" fill="#f2f3f5" letter-spacing="-0.5">DSH DeepSeek Monitor</text>
    <text x="64" y="152" font-size="16.5" fill="#9aa0ab">DeepSeek balance &amp; usage monitoring, built right into dsh</text>
    <g font-size="12" fill="#c9cdd6">
      <rect x="64" y="180" width="166" height="30" rx="15" fill="#2a2d36" stroke="#3d414d"/>
      <circle cx="80" cy="195" r="3.5" fill="#4DA6FF"/>
      <text x="90" y="199">Account details panel</text>
      <rect x="242" y="180" width="166" height="30" rx="15" fill="#2a2d36" stroke="#3d414d"/>
      <circle cx="258" cy="195" r="3.5" fill="#10b981"/>
      <text x="268" y="199">Live composer balance</text>
      <rect x="420" y="180" width="142" height="30" rx="15" fill="#2a2d36" stroke="#3d414d"/>
      <circle cx="436" cy="195" r="3.5" fill="#8F7DF0"/>
      <text x="446" y="199">Daily usage chart</text>
    </g>

    <!-- right: layered account-details card + floating composer pill -->
    <rect x="786" y="54" width="378" height="186" rx="14" fill="#2a2d37"/>
    <g filter="url(#sh)">
      <rect x="756" y="34" width="388" height="184" rx="14" fill="#23262e" stroke="#343845"/>
    </g>
    <text x="780" y="57" font-size="11" font-weight="600" fill="#f2f3f5">Account balance</text>
    <g fill="none" stroke="#9aa0ab" stroke-width="1.5" stroke-linecap="round">
      <path d="M1124,51 a6,6 0 1 1 -1.8,-4.4"/>
      <path d="M1122.6,44.2 l-2.4,2.6 3.4,0.9 z" fill="#9aa0ab" stroke="none"/>
    </g>
    <text x="780" y="96" font-size="14" font-weight="600" fill="#9aa0ab">&#165;</text>
    <text x="794" y="96" font-size="26" font-weight="700" fill="#f2f3f5">38.80</text>
    <rect x="780" y="102" width="150" height="28" rx="6" fill="#2c2f39"/>
    <text x="790" y="120" font-size="10" fill="#9aa0ab">Today</text>
    <text x="920" y="120" font-size="11" font-weight="600" fill="#f2f3f5" text-anchor="end">&#165;2.16</text>
    <rect x="942" y="102" width="178" height="28" rx="6" fill="#2c2f39"/>
    <text x="952" y="120" font-size="10" fill="#9aa0ab">This month</text>
    <text x="1110" y="120" font-size="11" font-weight="600" fill="#f2f3f5" text-anchor="end">&#165;11.04</text>
    <g font-size="11" fill="#c9cdd6">
      <circle cx="783" cy="142" r="3.5" fill="#4DA6FF"/>
      <text x="796" y="146">deepseek-v4-flash</text>
      <circle cx="783" cy="160" r="3.5" fill="#8F7DF0"/>
      <text x="796" y="164">deepseek-v4-flash-vision-exp</text>
      <circle cx="783" cy="178" r="3.5" fill="#4D6BFE"/>
      <text x="796" y="182">deepseek-v4-pro</text>
    </g>
    <rect x="1000" y="140" width="120" height="4" rx="2" fill="#333741"/>
    <rect x="1000" y="140" width="120" height="4" rx="2" fill="url(#pf)">
      <animate attributeName="width" values="120;120;14;120;120" keyTimes="0;0.179;0.232;0.411;1" dur="5.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="1000" y="158" width="120" height="4" rx="2" fill="#333741"/>
    <rect x="1000" y="158" width="48" height="4" rx="2" fill="url(#pv)">
      <animate attributeName="width" values="48;48;6;48;48" keyTimes="0;0.179;0.232;0.411;1" dur="5.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="1000" y="176" width="120" height="4" rx="2" fill="#333741"/>
    <rect x="1000" y="176" width="22" height="4" rx="2" fill="url(#pp)">
      <animate attributeName="width" values="22;22;3;22;22" keyTimes="0;0.179;0.232;0.411;1" dur="5.6s" repeatCount="indefinite"/>
    </rect>

    <!-- floating composer pill -->
    <g filter="url(#sh)">
      <rect x="690" y="186" width="360" height="36" rx="18" fill="#23262e" stroke="#343845"/>
    </g>
    <circle cx="712" cy="204" r="11" fill="#23262e" stroke="#3d414d"/>
    <path d="M712,199 V209 M707,204 H717" stroke="#9aa0ab" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <circle cx="862" cy="204" r="5" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="5;5;5;13;13" keyTimes="0;0.429;0.446;0.536;1" dur="5.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.429;0.446;0.536;1" dur="5.6s" repeatCount="indefinite"/>
    </circle>
    <text x="834" y="208" font-size="11" fill="#9aa0ab">&#165;</text>
    <text x="846" y="208" font-size="12" font-weight="600" fill="#34d399">38.80</text>
    <text x="988" y="208" text-anchor="end" font-size="12" font-weight="500" fill="#c9cdd6">DeepSeek V4 Pro</text>
    <path d="M992,201 l4,4 4,-4" fill="none" stroke="#9aa0ab" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="1022" cy="204" r="12" fill="#4D6BFE"/>
    <path d="M1022,209 V199.5 M1017.5,203.5 L1022,198.5 L1026.5,203.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
